<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0; padding:0; background-color:#F4EFEB; font-family:Arial, sans-serif;">
  <table role="presentation" width="100%" style="background-color:#F4EFEB; padding:40px 0;">
    <tr><td align="center">
      <table role="presentation" width="620" style="background-color:#ffffff; border-radius:16px; overflow:hidden; border:1px solid #E9DFD8;">
        <tr><td th:replace="~{email/layout-base :: header(${nombreEstablecimiento}, ${logoUrl})}"></td></tr>

        <tr><td style="background-color:#FAF6F3; border-bottom:1px solid #EFE8E3; padding:28px 32px; text-align:center;">
          <div style="width:48px; height:48px; border-radius:50%; background-color:#E8F5E9; margin:0 auto 12px auto; text-align:center; line-height:48px; font-size:24px;">✅</div>
          <h1 style="font-family:Georgia, serif; font-size:24px; color:#300006; margin:0 0 8px 0;">¡Tu pedido está listo!</h1>
          <p style="font-size:14px; color:#665558; margin:0;">Hola <strong th:text="${nombre}">Cliente</strong>, ya podés retirarlo.</p>
        </td></tr>

        <tr><td style="padding:32px;">
          <table role="presentation" width="100%" style="background-color:#FAF4F5; border:1px solid #E8D0D5; border-radius:12px;">
            <tr><td style="padding:20px; text-align:center;">
              <p style="font-size:12px; color:#7A5A60; margin:0 0 6px 0; text-transform:uppercase; letter-spacing:1px;">Número de pedido</p>
              <p style="font-family:Georgia, serif; font-size:28px; font-weight:bold; color:#300006; margin:0;" th:text="${numeroPedido}">PED-00000123</p>
            </td></tr>
          </table>
          <p style="font-size:13px; color:#665558; text-align:center; margin-top:20px;">Gracias por elegirnos. ¡Te esperamos!</p>
        </td></tr>

        <tr><td th:replace="~{email/layout-base :: footer(${nombreEstablecimiento})}"></td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
