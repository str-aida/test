<section class="product-list">

    <header class="product-list__header">

        <div class="product-list__header-title">

            <div class="product-list__icon-wrapper">
                <svg lucideShapes class="product-list__icon"></svg>
            </div>
            <div>
                <h1 class="product-list__title">
                    Gestión de productos
                </h1>
                <p class="product-list__subtitle">
                    Administrá los productos de tu establecimiento.
                </p>
            </div>

        </div>

        <button
            type="button"
            class="btn btn--primary product-list__add-btn"
            (click)="openCreateModal()">

            <svg lucidePlus class="btn__icon"></svg>
            <span>Nuevo producto</span>

        </button>

    </header>

    <app-products-table
        (editProduct)="openEditModal($event)">
    </app-products-table>

    <!-- MODAL DE NUEVO PRODUCTO -->
    @if (showCreateModal) {
        <div
            class="modal-overlay"
            (click)="closeCreateModal()">

            <div
                class="modal-card"
                (click)="$event.stopPropagation()">

                <!-- HEADER DEL MODAL -->
                <header class="modal-card__header">

                    <div class="modal-card__header-info">

                        <div class="modal-card__header-icon">
                            <svg lucideShapes></svg>
                        </div>

                        <div>
                            <h2 class="modal-card__title">
                                Nuevo producto
                            </h2>
                            <p class="modal-card__subtitle">
                                Completá los datos para registrar un nuevo producto.
                            </p>
                        </div>

                    </div>

                    <button
                        type="button"
                        class="modal-card__close"
                        aria-label="Cerrar modal"
                        (click)="closeCreateModal()">

                        <svg lucideX></svg>

                    </button>

                </header>

                <!-- FORMULARIO -->
                <div class="modal-card__body">

                    <app-product-form
                        (productCreated)="onProductCreate()"
                        (cancel)="closeCreateModal()">
                    </app-product-form>

                </div>

            </div>

        </div>
    }

    <!-- MODAL DE EDITAR PRODUCTO -->
    @if (showEditModal && selectedProduct) {
        <div
            class="modal-overlay"
            (click)="closeEditModal()">

            <div
                class="modal-card"
                (click)="$event.stopPropagation()">

                <!-- HEADER DEL MODAL -->
                <header class="modal-card__header">

                    <div class="modal-card__header-info">

                        <div class="modal-card__header-icon">
                            <svg lucideShapes></svg>
                        </div>

                        <div>
                            <h2 class="modal-card__title">
                                Editar producto
                            </h2>
                            <p class="modal-card__subtitle">
                                Modificá los datos del producto seleccionada.
                            </p>
                        </div>

                    </div>

                    <button
                        type="button"
                        class="modal-card__close"
                        aria-label="Cerrar modal"
                        (click)="closeEditModal()">

                        <svg lucideX></svg>

                    </button>

                </header>

                <!-- FORMULARIO -->
                <div class="modal-card__body">

                    <app-product-form
                        [editingProduct]="selectedProduct"
                        (productUpdated)="onProductUpdated()"
                        (cancel)="closeEditModal()">
                    </app-product-form>

                </div>

            </div>

        </div>
    }

</section>
