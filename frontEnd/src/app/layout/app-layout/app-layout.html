<div class="app-layout">
    @if (isSidebarOpen()) {
        <div class="app-layout__overlay" (click)="closeSidebar()"></div>
    }
    
    <app-sidebar [isOpen]="isSidebarOpen()" (closeMenu)="closeSidebar()" />

    <div class="app-layout__content">
        <app-topbar  (menuToggle)="toggleSidebar()" />
        <main class="app-layout__main">
            <router-outlet />
        </main>
    </div>
</div>
<app-notification />
