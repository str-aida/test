<form
    class="category-form"
    [formGroup]="categoryForm"
    (ngSubmit)="onSubmit()">

    <div class="form-field">

        <label
            class="form-field__label"
            for="name">
            Nombre de la categoría

            <span class="form-field__required">*</span>
        </label>

        <input
            id="name"
            class="form-field__input"
            type="text"
            formControlName="nombre"
            placeholder="Ej. Tortas, Bebidas, Postres"
            autocomplete="off">

        @if (hasError('nombre', 'required')) {
            <small class="form-field__error">
                El nombre es obligatorio.
            </small>
        } @else if (hasError('nombre', 'minlength') || hasError('nombre', 'maxlength')) {
            <small class="form-field__error">
                El nombre debe tener entre 3 y 100 caracteres.
            </small>
        }

    </div>

    <div class="form-field">

        <label
            class="form-field__label"
            for="description">
            Descripción
        </label>

        <textarea
            id="description"
            class="form-field__textarea"
            rows="3"
            formControlName="descripcion"
            placeholder="Variedad de tortas artesanales y postres enteros"></textarea>

        @if (hasError('descripcion', 'maxlength')) {
            <small class="form-field__error">
                La descripción no puede superar los 200 caracteres.
            </small>
        }

    </div>

    <div class="form-actions">

        <button
            type="submit"
            class="btn btn-primary"
            (click)="onCancel()">
            Cancelar
        </button>
        <button
            type="submit"
            class="btn btn--primary">
            Crear categoría
        </button>

    </div>

</form>
